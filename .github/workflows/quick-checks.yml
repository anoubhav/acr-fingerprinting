name: Quick checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install audio decoding tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Run implementation and evaluation tests
        run: python -m unittest discover -s outputs/acr_repro -p 'test_*.py'
      - name: Verify synthetic acoustic crops, clocks and calibration gates
        run: python outputs/acr_repro/test_neural_acoustic.py
      - name: Verify canonical evidence and provenance without audio
        run: python outputs/acr_repro/verify_v2_evidence.py --check results/v2_evidence_summary.json
      - name: Verify all adversarial-review evidence without audio
        run: python outputs/acr_repro/verify_v3_evidence.py
      - name: Recompute operating points, matrix and common-cohort timings
        run: |
          python outputs/acr_repro/check_paper_numbers.py --check results/paper_numbers_v2.json
          python outputs/acr_repro/derive_matrix_summary.py --check
          python outputs/acr_repro/derive_v2_profile_summary.py --check results/profiling/paper_timing_final.json
      - name: Check Python syntax
        run: python -m compileall -q outputs/acr_repro
