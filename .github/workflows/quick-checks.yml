name: Quick checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install audio decoding tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Run 15 meaningful implementation and evaluation tests
        run: python -m unittest discover -s outputs/acr_repro -p 'test_*.py'
      - name: Check Python syntax
        run: python -m compileall -q outputs/acr_repro
